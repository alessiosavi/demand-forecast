name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff --upgrade

      - name: Run Ruff linter
        run: ruff check .

      - name: Run Ruff formatter check
        run: ruff format --check .

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # - name: Run mypy
      #   run: mypy demand_forecast/

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,bench]"

      - name: Check lint and formatting
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests with bench
        run: python -m pytest -q --no-cov -m "not slow_audit"

      - name: Free runner disk before the second environment
        # The bench environment plus the restored pip cache (torch and the CUDA
        # libraries) leave too little space for a second venv on hosted runners.
        run: |
          df -h / "$RUNNER_TEMP" || true
          pip cache purge || true
          rm -rf /tmp/pytest-of-* "$RUNNER_TEMP"/pytest-of-* .pytest_cache
          df -h / "$RUNNER_TEMP" || true

      - name: Install dev-only dependencies in a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/dfc-devonly"
          "$RUNNER_TEMP/dfc-devonly/bin/python" -m pip install --no-cache-dir -e ".[dev]"

      - name: Run tests without bench
        run: '"$RUNNER_TEMP/dfc-devonly/bin/python" -m pytest -q --no-cov -m "not slow_audit"'

      # - name: Upload coverage to Codecov
      #   if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      #   uses: codecov/codecov-action@v4
      #   with:
      #     files: ./coverage.xml
      #     fail_ci_if_error: false

  corpus-audit:
    name: Corpus Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Decide whether corpus audits are needed
        id: audit
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Running corpus audits on push to $GITHUB_REF_NAME."
            exit 0
          fi

          # Compare the PR branch from its merge base; include both sides of renames.
          if ! git diff --name-only -z --no-renames "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/corpus-audit-changes"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Running corpus audits because the changed files could not be determined."
            exit 0
          fi

          while IFS= read -r -d '' path; do
            case "$path" in
              scripts/corpus_v4/*|demand_forecast/*|tests/test_corpus_v4/*|tests/helpers/*|configs/*|\
              .github/workflows/*|pyproject.toml|tests/conftest.py|tests/__init__.py|scripts/__init__.py|\
              conftest.py|pytest.ini|tox.ini|setup.cfg|setup.py)
                # pretrain/bench also reach config, data, core, models and inference.
                echo "run=true" >> "$GITHUB_OUTPUT"
                echo "Running corpus audits because a dependency changed: $path"
                exit 0
                ;;
            esac
          done < "$RUNNER_TEMP/corpus-audit-changes"

          echo "run=false" >> "$GITHUB_OUTPUT"
          echo "Skipping corpus audits: no corpus, package, shared fixture, configuration or workflow changes."

      - name: Set up Python
        if: steps.audit.outputs.run == 'true'
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        if: steps.audit.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,bench]"

      - name: Run corpus audits
        if: steps.audit.outputs.run == 'true'
        run: python -m pytest -q --no-cov -m slow_audit

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check installed wheel without bench outside the checkout
        run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheelenv/bin/demand-forecast --help
          /tmp/wheelenv/bin/python -c "from demand_forecast.bench.specs import load_task_specs; assert len(load_task_specs('weekly')) == 7; assert len(load_task_specs('heldout')) == 5"

      - name: Check package
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dist
          path: dist/

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check docstrings
        run: |
          # Check for missing docstrings in public modules
          python -c "
          import ast
          import sys
          from pathlib import Path

          errors = []
          for py_file in Path('demand_forecast').rglob('*.py'):
              if py_file.name.startswith('_') and py_file.name != '__init__.py':
                  continue
              try:
                  tree = ast.parse(py_file.read_text())
                  for node in ast.walk(tree):
                      if isinstance(node, (ast.FunctionDef, ast.ClassDef)):
                          if not node.name.startswith('_'):
                              docstring = ast.get_docstring(node)
                              if not docstring:
                                  errors.append(f'{py_file}:{node.lineno}: {node.name} missing docstring')
              except SyntaxError:
                  pass

          if errors:
              print('Missing docstrings:')
              for error in errors[:20]:  # Limit output
                  print(f'  {error}')
              if len(errors) > 20:
                  print(f'  ... and {len(errors) - 20} more')
              # Don't fail for now, just warn
              # sys.exit(1)
          "
